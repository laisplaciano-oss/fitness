
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Matrícula | Fitness Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <h1>FITNESS MANAGER</h1>
        <p>Cadastro de nova matrícula</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Dados do aluno</h2>

            <form action="processar.php" method="POST">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite o nome completo" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade"
                       min="18" placeholder="Mínimo 18 anos" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="(00) 00000-0000" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="exemplo@email.com" required>

                <label for="data">Data da matrícula:</label>
                <input type="date" id="data" name="data"
                       required>

                <label for="plano">Plano:</label>
                <select id="plano" name="plano" required>
                    <option value="">Selecione um plano</option>
                    <option value="basico">Básico - R$ 89,90</option>
                    <option value="plus">Plus - R$ 129,90</option>
                    <option value="premium">Premium - R$ 179,90</option>
                </select>

                <label for="pagamento">Forma de pagamento:</label>
                <select id="pagamento" name="pagamento" required>
                    <option value="">Selecione o pagamento</option>
                    <option value="pix">PIX</option>
                    <option value="cartao">Cartão</option>
                </select>

                <button type="submit" class="botao">
                    Finalizar matrícula
                </button>

                <a href="index.html" class="botao secundario">
                    Voltar ao painel
                </a>

            </form>
        </section>
    </main>

    <footer>
        <p>Fitness Manager © 2026</p>
    </footer>

</body>
</html>
